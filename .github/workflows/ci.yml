name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore tests/ServiceOperations.Api.Tests/ServiceOperations.Api.Tests.csproj

      - name: Test
        run: dotnet test tests/ServiceOperations.Api.Tests/ServiceOperations.Api.Tests.csproj --no-restore --configuration Release

